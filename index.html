<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disipll</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #222;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 8px;
            border: none;
            margin-bottom: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .video {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Disipll</h1>
</header>

<div class="container">

    <h2>YouTube Video</h2>

    <input
        id="videoID"
        placeholder="Paste a YouTube video ID"
    >

    <button onclick="loadVideo()">Watch</button>

    <div class="video">
        <iframe
            id="player"
            src=""
            allowfullscreen>
        </iframe>
    </div>

</div>

<script>
function loadVideo() {
    const id = document.getElementById("videoID").value.trim();

    if (id) {
        document.getElementById("player").src =
            "https://www.youtube.com/embed/" + id;
    }
}
</script>

</body>
</html>
