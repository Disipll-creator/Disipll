<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Disipll Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .search {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      background: #222;
    }

    .player {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      margin-top: 15px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .player iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      border: 0;
    }

    @media (max-width: 600px) {
      .search {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Disipll</h1>

    <div class="search">
      <input
        id="videoInput"
        type="text"
        placeholder="Paste YouTube URL or video ID"
      >

      <button onclick="loadVideo()">
        Check Video
      </button>
    </div>

    <div id="status">
      Enter a YouTube video to test it.
    </div>

    <div class="player">
      <iframe
        id="player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

  </div>

  <script>
    function getVideoID(input) {

      input = input.trim();

      // If they pasted just the ID
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return input;
      }

      try {
        const url = new URL(input);

        // youtube.com/watch?v=
        if (url.searchParams.get("v")) {
          return url.searchParams.get("v");
        }

        // youtu.be/VIDEOID
        if (url.hostname === "youtu.be") {
          return url.pathname.substring(1);
        }

        // youtube.com/embed/VIDEOID
        if (url.pathname.startsWith("/embed/")) {
          return url.pathname.split("/embed/")[1];
        }

      } catch (error) {
        return null;
      }

      return null;
    }

    function loadVideo() {

      const input = document.getElementById("videoInput").value;
      const status = document.getElementById("status");
      const player = document.getElementById("player");

      const videoID = getVideoID(input);

      if (!videoID) {
        status.innerText = "❌ I couldn't find a valid YouTube video ID.";
        player.src = "";
        return;
      }

      status.innerText = "⏳ Loading video...";

      player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoID) +
        "?rel=0";

      setTimeout(function() {
        status.innerText =
          "🟢 The video was sent to the YouTube player. If it doesn't play, YouTube may have disabled embedding for this video or the network may be blocking playback.";
      }, 2500);
    }
  </script>

</body>
</html>
